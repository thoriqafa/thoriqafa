# ============================================================
# TECH STACK BADGES
# ============================================================
# Badge di bawah ini di-render oleh scripts/badges.py, BUKAN oleh AI.
# Isi `badges` dengan id dari BADGE_CATALOG di scripts/badges.py.
# Urutan di sini menentukan urutan badge pada README.
tech_stack:
  # Tambahkan badge dari bahasa repo yang belum ada di daftar di bawah,
  # ke grup `auto_append_group`. Set false kalau mau daftar fully manual.
  auto_append_languages: true
  auto_append_group: "Languages"
  groups:
    - name: "Languages"
      badges:
        - python
        - php
        - delphi
        - typescript
        - javascript
        - java
        - cplusplus
        - sql
    - name: "Frameworks & Tools"
      badges:
        - laravel
        - codeigniter
        - nodejs
        - fastapi
        - docker
        - linux
        - git
        - mysql
    - name: "AI & Data"
      badges:
        - ai
        - jupyter
        - matlab

readme:
  language: "English"
  sections:
    - hero
    - about
    - tech_stack
    - featured_projects
    - github_statistics
    - contribution_streak
    - contribution_activity
    - currently_exploring
    - contact
  max_featured_projects: 7
  allow_ai_to:
    - improve_wording
    - summarize_projects
    - organize_information
    - generate_section_descriptions
  forbid_ai_from:
    - inventing_projects
    - inventing_experience
    - inventing_statistics
    - inventing_companies
    - inventing_certifications
    - inventing_skills
    - inventing_achievements
    - inventing_badges
